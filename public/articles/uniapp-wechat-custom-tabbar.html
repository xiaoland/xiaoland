      content="先简单记录一下，解决的是新的微信小程序基础库或者uniapp更新导致的，在this.$mp里面获取不到页面实例了 通过getCurrentPages 0 获取到当前页面实例，里面有getTabBar，可以获取到当前页面的TabBar组件实例。"

  <body>
    <header>
      <a
        id="page-back"
        class="typo-control flex-row spacing-xs"
        href="/"
        onclick="
                    if (history.length > 1) {
                        history.back();
                        return false;
                    }
                "
      >
        <span class="material-symbols">arrow_back</span>
        <span>返回</span>
      </a>
      <h1>问题解决：uniapp在微信小程序自定义TabBar</h1>
      <time datetime="2024-11-20T10:22:32Z">最后更新于 Wed Nov 20 2024</time>
    </header>
    <main>
      <article>
        <blockquote>
          <p>
            先简单记录一下，解决的是新的微信小程序基础库或者uniapp更新导致的，在<code
              >this.$mp</code
            >里面获取不到页面实例了
          </p>
        </blockquote>
        <p>
          通过<code>getCurrentPages()[0]</code>获取到当前页面实例，里面有<code
            >getTabBar</code
          >，可以获取到当前页面的TabBar组件实例。
        </p>
      </article>
    </main>
  </body>
