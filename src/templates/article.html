<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#ffffff" />
        <meta name="author" content="蓝汁酱" />
        <meta name="google-adsense-account" content="ca-pub-2521214392427276" />
        <title>${data.title}</title>
        <meta name="description" content="${data.description}" />
        <meta property="og:url" content="${data.canonicalUrl}" />
        <meta property="og:type" content="article" />
        <meta property="og:title" content="${data.title}" />
        <meta property="og:description" content="${data.description}" />
        <!--<meta property="og:image" content="https://example.com/og/article.png">-->
        <meta property="og:site_name" content="蓝汁酱的小站" />
        <meta property="og:locale" content="zh_CN" />
        <link rel="canonical" href="${data.canonicalUrl}" />
        <link rel="stylesheet" href="/assets/main.css" />
        <link rel="stylesheet" href="/assets/variables.css" />
        <link rel="stylesheet" href="/articles/index.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols"
            rel="stylesheet"
        />
    </head>
    <body>
        <header>
            <a
                id="page-back"
                class="typo-control flex-row spacing-xs items-center"
                href="/"
                onclick="
                    if (history.length > 1) {
                        history.back();
                        return false;
                    }
                "
            >
                <span class="material-symbols">arrow_back</span>
                <span>返回</span>
            </a>
            <h1>${data.title}</h1>
            <dl id="meta">
                <dt>最后更新于</dt>
                <dd>
                    <time
                        id="last-updated-at"
                        class="localized"
                        datetime="${data.datetime}"
                    />
                </dd>
                <!-- createdAt
                <dt>开始于</dt>
                <dd>
                    <time datetime="${data.createdAt}">${data.createdAt}</time>
                </dd>
                createdAt-->
                <!-- finishedAt
                <dt>完成于</dt>
                <dd>
                    <time datetime="${data.finishedAt}">${data.finishedAt}</time>
                </dd>
                finishedAt -->
            </dl>
        </header>
        <main>
            <article>${body}</article>
        </main>
    </body>

    <script type="module">
        const formatter = new Intl.DateTimeFormat(undefined, {
            dateStyle: "medium",
            timeStyle: "short",
        });

        for (const el of document.querySelectorAll("time.localized")) {
            const date = new Date(el.dateTime);
            el.textContent = formatter.format(date);
        }
    </script>
</html>
